version = 1

test_patterns = [
  "tests/**",
  "orchestrator/test/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*_test.py"
]

[[analyzers]]
name = "secrets"

[[analyzers]]
name = "test-coverage"

[[analyzers]]
name = "sql"

[[analyzers]]
name = "python"

[analyzers.meta]
runtime_version = "3.x.x"

[[analyzers]]
name = "javascript"
dependency_file_paths = ["frontend", "launcher"]

[analyzers.meta]
plugins = ["react"]
environment = ["nodejs", "browser", "vitest"]
module_system = "es-modules"
dialect = "typescript"

[[analyzers]]
name = "docker"

[analyzers.meta]
dockerfile_paths = ["Dockerfile"]
