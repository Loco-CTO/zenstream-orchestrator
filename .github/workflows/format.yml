name: Auto formatting

"on":
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "pyproject.toml"
      - "ruff.toml"
      - ".ruff.toml"
      - ".github/workflows/format.yml"
      - "frontend/**/*.ts"
      - "frontend/**/*.tsx"
      - "frontend/**/*.js"
      - "frontend/**/*.mjs"
      - "frontend/**/*.json"
      - "frontend/**/*.css"
      - "frontend/**/*.md"
      - "frontend/package.json"
      - "frontend/.prettierrc"
      - "frontend/.prettierignore"
      - "frontend/eslint.config.mjs"
      - "launcher/**/*.ts"
      - "launcher/**/*.tsx"
      - "launcher/**/*.json"
      - "launcher/**/*.css"
      - "launcher/**/*.md"
      - "launcher/.prettierignore"
permissions:
  contents: write

concurrency:
  group: branch-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply Ruff lint fixes
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: check --fix-only

      - name: Format Python
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: format

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Format dashboard files with Prettier
        working-directory: frontend
        run: npm run format
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format launcher files
        working-directory: launcher
        run: npm run lint:fix

      - name: Commit Ruff changes
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m 'style: apply backend and frontend formatting'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
