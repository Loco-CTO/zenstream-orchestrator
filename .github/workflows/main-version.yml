name: Update main version

on:
  push:
    branches: [main]
    paths-ignore: [.main-version.json]

permissions:
  contents: write

concurrency:
  group: branch-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Format dashboard files with Prettier
        working-directory: frontend
        run: npm run format
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format launcher files
        working-directory: launcher
        run: npm run lint:fix
      - name: Apply Ruff lint fixes
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: check --fix-only
      - name: Format Python
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: format
      - name: Update tracked counter
        id: counter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --format=%s)" =~ ^chore:\ release\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            count=0
          else
            tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)
            if [ -n "$tag" ]; then
              count=$(git rev-list "$tag..HEAD" --count)
            else
              count=$(git rev-list HEAD --count)
            fi
          fi
          printf '{\n  "main": %s\n}\n' "$count" > .main-version.json
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit counter
        if: steps.counter.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m "chore: update main version counter"
          git push origin HEAD:main
