services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-9088}:9088"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      # The image contains bundled ffmpeg/ffprobe binaries. These overrides are
      # optional and are only needed for development or custom tool builds.
      FFMPEG_PATH: "${FFMPEG_PATH:-}"
      FFPROBE_PATH: "${FFPROBE_PATH:-}"
      MAX_TRANSCODES: "${MAX_TRANSCODES:-0}"
      MAX_TRANSCODES_PER_USER: "${MAX_TRANSCODES_PER_USER:-0}"
      ZENSTREAM_PUBLIC_WEB_URL: "${ZENSTREAM_PUBLIC_WEB_URL:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}"
      # The host METADATA_PATH is mounted here; application paths must use the
      # writable in-container destination rather than the host source path.
      METADATA_PATH: /app/sqlite
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 9088
    volumes:
      # Media is mounted read-only. Set LIBRARY_PATH to an existing host
      # directory; the administrator dashboard should use /media (or a child).
      - "${LIBRARY_PATH:?Set LIBRARY_PATH}:/media:ro"
      # This holds SQLite, rotating logs, and all generated metadata, artwork,
      # and trickplay caches. Keep it separate from the media library and writable.
      - "${METADATA_PATH:-./metadata}:/app/sqlite"
    restart: unless-stopped
    mem_limit: ${ORCHESTRATOR_MEMORY_LIMIT:-4g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
