name: Version and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        default: fix
        options:
          - fix
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump Orchestrator and launcher versions
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' orchestrator/version.py)
          [ -n "$version" ] || { echo 'Could not read orchestrator version.' >&2; exit 1; }
          IFS=. read -r major minor fix <<< "$version"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; fix=0 ;;
            minor) minor=$((minor + 1)); fix=0 ;;
            fix) fix=$((fix + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          new_version="$major.$minor.$fix"
          tag="v$new_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists." >&2
            exit 1
          fi
          sed -i "s/^__version__ = \"$version\"$/__version__ = \"$new_version\"/" orchestrator/version.py
          npm version "$new_version" --no-git-tag-version --allow-same-version --prefix launcher
          printf '{\n  "main": 0\n}\n' > .main-version.json
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit and push main
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/version.py launcher/package.json launcher/package-lock.json .main-version.json
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Align stable with main
        run: |
          git fetch origin stable || true
          stable_sha=$(git rev-parse refs/remotes/origin/stable 2>/dev/null || printf '%040d' 0)
          git push origin "HEAD:stable" --force-with-lease="refs/heads/stable:$stable_sha"

  windows-package:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build signed-ready Windows artifacts
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: ./scripts/build-windows.ps1 -PythonExecutable python
      - name: Smoke-test packaged backend lifecycle
        run: node scripts/smoke-windows-backend.mjs
      - name: Create GitHub release and attach Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          $releaseFiles = @(
            Get-ChildItem -LiteralPath launcher/release -File -Filter '*.exe' |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
            (Resolve-Path -LiteralPath launcher/release/SHA256SUMS.txt).Path
          )
          if ($releaseFiles.Count -lt 3) {
            throw 'Expected both Windows executables and SHA256SUMS.txt in launcher/release.'
          }
          & gh release create $env:TAG @releaseFiles --target $env:SHA --title $env:TAG --generate-notes
