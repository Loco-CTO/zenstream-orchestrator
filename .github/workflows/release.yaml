name: Version and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        default: fix
        options:
          - fix
          - minor
          - major
      retry_version:
        description: Candidate or published release version to retry without bumping
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: orchestrator-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      candidate_ref: ${{ steps.prepare.outputs.candidate_ref }}
      candidate_ref_present: ${{ steps.prepare.outputs.candidate_ref_present }}
      base_main: ${{ steps.prepare.outputs.base_main }}
      base_stable: ${{ steps.prepare.outputs.base_stable }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare or reuse release candidate
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-candidate.sh
          git fetch origin main stable

          if [[ -n "$RETRY_VERSION" ]]; then
            version="${RETRY_VERSION#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "retry_version must be a semantic version such as 1.6.5 or v1.6.5." >&2
              exit 1
            }
            tag="v$version"
            candidate_ref="refs/heads/release-candidate/$tag"
            tag_ref="refs/tags/$tag"
            candidate_ref_sha="$(remote_ref_sha "$candidate_ref")"
            candidate_ref_present=false
            if [[ -n "$candidate_ref_sha" ]]; then
              candidate_ref_present=true
            fi
            published=false
            if gh release view "$tag" --json isDraft --jq '.isDraft' >"$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
              if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" == "false" ]]; then
                published=true
              fi
            fi
            sha="$(resolve_retry_candidate "$candidate_ref" "$tag_ref" "$published")"
            if [[ -n "$candidate_ref_sha" ]]; then
              git fetch origin "$candidate_ref:refs/remotes/origin/release-candidate/$version"
            else
              git fetch origin "$tag_ref:refs/tags/$tag"
            fi
            git checkout --detach "$sha"
            actual_version="$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' orchestrator/version.py)"
            [[ "$actual_version" == "$version" ]] || {
              echo "Candidate $sha contains version $actual_version, not requested version $version." >&2
              exit 1
            }
            base_main="$(release_trailer "$sha" main)"
            base_stable="$(release_trailer "$sha" stable)"
            if [[ -z "$base_main" || -z "$base_stable" ]]; then
              [[ "$(remote_ref_sha refs/heads/main)" == "$sha" && "$(remote_ref_sha refs/heads/stable)" == "$sha" ]] || {
                echo "This published tag has no recorded branch bases and is not already promoted on both branches." >&2
                exit 1
              }
              base_main="$sha"
              base_stable="$sha"
            else
              [[ "$(git rev-parse "$sha^")" == "$base_main" ]] || {
                echo "Candidate $sha does not have its recorded main base $base_main as its parent." >&2
                exit 1
              }
            fi
            echo "Reusing candidate SHA $sha for $tag."
          else
            base_main="$(remote_ref_sha refs/heads/main)"
            base_stable="$(remote_ref_sha refs/heads/stable)"
            [[ -n "$base_main" && -n "$base_stable" ]] || {
              echo "Both main and stable must exist before an Orchestrator release." >&2
              exit 1
            }
            [[ "$(git rev-parse HEAD)" == "$base_main" ]] || {
              echo "main moved while the release candidate was being prepared." >&2
              exit 1
            }
            current_version="$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' orchestrator/version.py)"
            [[ -n "$current_version" ]] || {
              echo "Could not read Orchestrator version." >&2
              exit 1
            }
            IFS=. read -r major minor fix <<< "$current_version"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; fix=0 ;;
              minor) minor=$((minor + 1)); fix=0 ;;
              fix) fix=$((fix + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="$major.$minor.$fix"
            tag="v$version"
            candidate_ref="refs/heads/release-candidate/$tag"
            tag_ref="refs/tags/$tag"
            [[ -z "$(remote_ref_sha "$candidate_ref")" ]] || {
              echo "Candidate $candidate_ref already exists; retry it with retry_version=$version." >&2
              exit 1
            }
            [[ -z "$(remote_tag_commit_sha "$tag_ref")" ]] || {
              echo "Release tag $tag already exists; retry it with retry_version=$version." >&2
              exit 1
            }
            sed -i "s/^__version__ = \"$current_version\"$/__version__ = \"$version\"/" orchestrator/version.py
            npm version "$version" --no-git-tag-version --allow-same-version --prefix launcher
            printf '{\n  "main": 0\n}\n' > .main-version.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add orchestrator/version.py launcher/package.json launcher/package-lock.json .main-version.json
            git commit -m "chore: release $tag" -m "release-base-main: $base_main" -m "release-base-stable: $base_stable"
            sha="$(git rev-parse HEAD)"
            git push origin "$sha:$candidate_ref"
            [[ "$(remote_ref_sha "$candidate_ref")" == "$sha" ]] || {
              echo "Release candidate ref did not settle at $sha." >&2
              exit 1
            }
            candidate_ref_present=true
          fi

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Resolved release candidate is not a full Git SHA: $sha" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=$candidate_ref" >> "$GITHUB_OUTPUT"
          echo "candidate_ref_present=$candidate_ref_present" >> "$GITHUB_OUTPUT"
          echo "base_main=$base_main" >> "$GITHUB_OUTPUT"
          echo "base_stable=$base_stable" >> "$GITHUB_OUTPUT"

      - name: Test release candidate and workflow guards
        run: |
          bash scripts/release-candidate.test.sh
          python3 scripts/release-workflow.test.py

  validate:
    needs: candidate
    uses: ./.github/workflows/coverage.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      skip_coverage_upload: true

  validate-windows:
    needs: candidate
    uses: ./.github/workflows/windows-launcher.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}

  publish:
    needs: [candidate, validate, validate-windows]
    runs-on: windows-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify branch refs before packaging and publishing
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_REF: ${{ needs.candidate.outputs.candidate_ref }}
          CANDIDATE_REF_PRESENT: ${{ needs.candidate.outputs.candidate_ref_present }}
          BASE_MAIN: ${{ needs.candidate.outputs.base_main }}
          BASE_STABLE: ${{ needs.candidate.outputs.base_stable }}
        run: |
          source scripts/release-candidate.sh
          assert_candidate_ref_state "$CANDIDATE_REF" "$CANDIDATE_SHA" "$CANDIDATE_REF_PRESENT"
          assert_ref_state refs/heads/main "$BASE_MAIN" "$CANDIDATE_SHA"
          assert_ref_state refs/heads/stable "$BASE_STABLE" "$CANDIDATE_SHA"

      - name: Build signed-ready Windows artifacts
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: ./scripts/build-windows.ps1 -PythonExecutable python

      - name: Smoke-test packaged backend lifecycle
        run: node scripts/smoke-windows-backend.mjs

      - name: Recheck branch refs before publishing
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_REF: ${{ needs.candidate.outputs.candidate_ref }}
          CANDIDATE_REF_PRESENT: ${{ needs.candidate.outputs.candidate_ref_present }}
          BASE_MAIN: ${{ needs.candidate.outputs.base_main }}
          BASE_STABLE: ${{ needs.candidate.outputs.base_stable }}
        run: |
          source scripts/release-candidate.sh
          assert_candidate_ref_state "$CANDIDATE_REF" "$CANDIDATE_SHA" "$CANDIDATE_REF_PRESENT"
          assert_ref_state refs/heads/main "$BASE_MAIN" "$CANDIDATE_SHA"
          assert_ref_state refs/heads/stable "$BASE_STABLE" "$CANDIDATE_SHA"

      - name: Create or reuse draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.candidate.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          $releaseJson = & gh release view $env:TAG --json tagName,targetCommitish,isDraft 2>$null
          $viewExitCode = $LASTEXITCODE
          if ($viewExitCode -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.tagName -ne $env:TAG) {
              throw "GitHub release lookup returned an unexpected tag for $env:TAG."
            }
            if ($release.targetCommitish -ne $env:CANDIDATE_SHA) {
              if (-not $release.isDraft) {
                throw "Published release $env:TAG targets $($release.targetCommitish); refusing to retarget it."
              }
              & gh release edit $env:TAG --target $env:CANDIDATE_SHA
              if ($LASTEXITCODE -ne 0) {
                throw "Could not retarget draft release $env:TAG to candidate $env:CANDIDATE_SHA."
              }
            }
          } else {
            & gh release create $env:TAG --target $env:CANDIDATE_SHA --draft --title $env:TAG --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create draft release $env:TAG."
            }
          }

      - name: Verify release targets the candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.candidate.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          $releaseJson = & gh release view $env:TAG --json tagName,targetCommitish
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect GitHub release $env:TAG."
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -ne $env:TAG -or $release.targetCommitish -ne $env:CANDIDATE_SHA) {
            throw "GitHub release $env:TAG does not target candidate $env:CANDIDATE_SHA."
          }

      - name: Upload and verify Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.candidate.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          $releaseDirectory = Resolve-Path -LiteralPath launcher/release
          $executables = @(Get-ChildItem -LiteralPath $releaseDirectory -File -Filter '*.exe' | Sort-Object Name)
          $checksumFile = Join-Path $releaseDirectory 'SHA256SUMS.txt'
          if ($executables.Count -ne 2 -or -not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
            throw 'Expected two Windows executables and SHA256SUMS.txt in launcher/release.'
          }
          $releaseFiles = @($executables | ForEach-Object { $_.FullName }) + @($checksumFile)
          $assetNames = @($releaseFiles | ForEach-Object { [System.IO.Path]::GetFileName($_) })
          foreach ($releaseFile in $releaseFiles) {
            if ((Get-Item -LiteralPath $releaseFile).Length -le 0) {
              throw "Release artifact is empty: $releaseFile"
            }
          }

          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'zenstream-orchestrator-release-assets'
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
          $arguments = @('release', 'upload', $env:TAG) + $releaseFiles + @('--clobber')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload release assets for $env:TAG."
          }
          & gh release download $env:TAG --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download release assets for verification from $env:TAG."
          }

          foreach ($releaseFile in $releaseFiles) {
            $assetName = [System.IO.Path]::GetFileName($releaseFile)
            $downloadedFile = Join-Path $downloadDirectory $assetName
            if (-not (Test-Path -LiteralPath $downloadedFile -PathType Leaf)) {
              throw "Release asset is missing after upload: $assetName"
            }
            $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releaseFile).Hash
            $downloadHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadedFile).Hash
            if ($sourceHash -ne $downloadHash) {
              throw "Downloaded release asset $assetName does not match the built file."
            }
          }

          $checksumLines = Get-Content -LiteralPath (Join-Path $downloadDirectory 'SHA256SUMS.txt')
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^([A-Fa-f0-9]{64})\s+\*?(.+)$') {
              throw "Malformed checksum entry: $line"
            }
            $expectedHash = $Matches[1]
            $assetPath = Join-Path $downloadDirectory $Matches[2].Trim()
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Checksum file names missing asset $($Matches[2])."
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash
            if ($actualHash -ne $expectedHash) {
              throw "Checksum verification failed for $($Matches[2])."
            }
          }
          & gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish verified release $env:TAG."
          }
          $isDraft = & gh release view $env:TAG --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') {
            throw "Release $env:TAG did not become public after asset verification."
          }

      - name: Verify published release tag matches the candidate
        shell: bash
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          source scripts/release-candidate.sh
          [[ "$(remote_tag_commit_sha "refs/tags/$TAG")" == "$CANDIDATE_SHA" ]]

  promote:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Promote main and stable with compare-and-swap
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_REF: ${{ needs.candidate.outputs.candidate_ref }}
          CANDIDATE_REF_PRESENT: ${{ needs.candidate.outputs.candidate_ref_present }}
          BASE_MAIN: ${{ needs.candidate.outputs.base_main }}
          BASE_STABLE: ${{ needs.candidate.outputs.base_stable }}
        run: |
          source scripts/release-candidate.sh
          assert_candidate_ref_state "$CANDIDATE_REF" "$CANDIDATE_SHA" "$CANDIDATE_REF_PRESENT"
          assert_ref_state refs/heads/main "$BASE_MAIN" "$CANDIDATE_SHA"
          assert_ref_state refs/heads/stable "$BASE_STABLE" "$CANDIDATE_SHA"
          promote_refs "$CANDIDATE_SHA" refs/heads/main "$BASE_MAIN" refs/heads/stable "$BASE_STABLE"
          delete_candidate_ref "$CANDIDATE_REF" "$CANDIDATE_SHA"
