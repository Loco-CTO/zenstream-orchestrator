name: Windows launcher

"on":
  pull_request:
    paths:
      - "launcher/**"
      - "scripts/build-windows.ps1"
      - "scripts/smoke-windows-backend.mjs"
      - "orchestrator/**"
      - "frontend/**"
      - "requirements.txt"
      - ".github/workflows/windows-launcher.yml"
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "scripts/**"
      - "orchestrator/**"
      - "frontend/**"
      - "requirements.txt"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify native Windows Watchdog events
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check watchdog
          $env:PYTHONPATH = "orchestrator"
          python -m unittest orchestrator.test.windows_watchdog_test
      - name: Build Windows launcher and installer artifacts
        shell: pwsh
        run: ./scripts/build-windows.ps1 -PythonExecutable python
      - name: Smoke-test packaged backend lifecycle
        run: node scripts/smoke-windows-backend.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: zenstream-orchestrator-windows-x64
          path: |
            launcher/release/*.exe
            launcher/release/SHA256SUMS.txt
          if-no-files-found: error
