name: API contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator-contract:
    runs-on: ubuntu-latest
    outputs:
      baseline_ready: ${{ steps.baseline.outputs.ready }}

    steps:
      - name: Check out Orchestrator source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-contracts.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt -r requirements-contracts.txt

      - name: Check OpenAPI snapshot and fixtures
        run: |
          python orchestrator/scripts/export_openapi.py --check
          python orchestrator/scripts/generate_contract_fixtures.py --check

      - name: Check whether the base contract baseline exists
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || git cat-file -e "${BASE_SHA}:contracts/openapi.json" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Install pinned oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@v1.32.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check OpenAPI compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:contracts/openapi.json" 2>/dev/null; then
            git show "${BASE_SHA}:contracts/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
            "$(go env GOPATH)/bin/oasdiff" breaking \
              "$RUNNER_TEMP/openapi-base.json" contracts/openapi.json \
              --err-ignore contracts/breaking-change-exceptions.md \
              --warn-ignore contracts/breaking-change-exceptions.md \
              --fail-on WARN
          else
            echo "No base snapshot exists yet; establishing the initial OpenAPI baseline."
          fi

      - name: Verify oasdiff compatibility thresholds
        run: python orchestrator/scripts/check_oasdiff_behavior.py

  web-client:
    needs: orchestrator-contract
    if: needs.orchestrator-contract.outputs.baseline_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Web main
        uses: actions/checkout@v7
        with:
          repository: Loco-CTO/zenstream
          ref: main
          path: web

      - name: Check whether Web fixture tests are on main
        id: web-contract-tests
        working-directory: web
        run: |
          if [ -f test/api-contract-fixtures.test.ts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Web fixture tests have not landed on main; leaving this rollout gate staged."
          fi

      - name: Check out this Orchestrator pull request's fixtures
        uses: actions/checkout@v7
        with:
          repository: Loco-CTO/zenstream-orchestrator
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: web/_contracts/zenstream-orchestrator
          sparse-checkout: contracts/fixtures

      - name: Set up pnpm
        if: steps.web-contract-tests.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        if: steps.web-contract-tests.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Web dependencies
        if: steps.web-contract-tests.outputs.ready == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run Web contract tests
        if: steps.web-contract-tests.outputs.ready == 'true'
        working-directory: web
        env:
          ZENSTREAM_API_FIXTURE_ROOT: ${{ github.workspace }}/web/_contracts/zenstream-orchestrator/contracts/fixtures
        run: pnpm exec vitest run test/api-contract-fixtures.test.ts test/syncplay.test.tsx

  android-client:
    needs: orchestrator-contract
    if: needs.orchestrator-contract.outputs.baseline_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android main
        uses: actions/checkout@v7
        with:
          repository: Loco-CTO/zenstream-mobile
          ref: main
          path: android

      - name: Check whether Android fixture tests are on main
        id: android-contract-tests
        working-directory: android
        run: |
          if [ -f app/src/test/java/com/zenstream/zenstreammobile/data/ApiContractFixturesTest.kt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android fixture tests have not landed on main; leaving this rollout gate staged."
          fi

      - name: Check out this Orchestrator pull request's fixtures
        uses: actions/checkout@v7
        with:
          repository: Loco-CTO/zenstream-orchestrator
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: android/_contracts/zenstream-orchestrator
          sparse-checkout: contracts/fixtures

      - name: Set up Java
        if: steps.android-contract-tests.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: steps.android-contract-tests.outputs.ready == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        if: steps.android-contract-tests.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android contract tests
        if: steps.android-contract-tests.outputs.ready == 'true'
        working-directory: android
        env:
          ZENSTREAM_API_FIXTURE_ROOT: ${{ github.workspace }}/android/_contracts/zenstream-orchestrator/contracts/fixtures
        run: >-
          bash ./gradlew :app:testDebugUnitTest
          --tests com.zenstream.zenstreammobile.data.ApiContractFixturesTest
